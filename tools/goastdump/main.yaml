---
package: main
description: 'goastdump parses Go source files with go/parser and prints their top-level
  declarations as JSON. It is the syntactic front end of tools/go.meta.gen.py: the
  Python side decides what counts as an external reference and writes the companion
  YAML, this tool only reports what the Go syntax tree says. Usage: goastdump <file.go>
  [<file.go> ...] Only the standard library is used and no type checking happens,
  so it runs offline and without the dependencies of the code it reads. A call receiver
  is resolved to a type only where the syntax states it (parameter, receiver, "var
  x T", "x := T{}" / "x := &T{}"); everything else stays untyped.'
tags:
- core
- gateway
category: []
used_in: []
entrypoint: true
related_nodes: []
objects:
- name: Ref
  kind: struct
  description: 'Ref is a selector on an imported package alias: Pkg.Name.'
  implements: []
  references: []
- name: Call
  kind: struct
  description: Call is an exported function or method call. Pkg is set for a call
    through an import alias or a receiver typed by one; Type is set when the receiver
    type is known (local or imported); both empty means the receiver could not be
    typed.
  implements: []
  references: []
- name: Object
  kind: struct
  description: Object is one top-level declaration.
  implements: []
  references: []
- name: FileDump
  kind: struct
  description: FileDump is the result for one input file.
  implements: []
  references: []
- name: fileCtx
  kind: struct
  description: 'fileCtx is the per-file resolution context: the imports in scope,
    keyed by the name the file uses for them (explicit alias or guessed package name).'
  implements: []
  references: []
- name: collector
  kind: struct
  description: collector gathers refs and calls from a subtree, first occurrence order,
    without duplicates.
  implements: []
  references: []
- name: guessPkgName
  kind: func
  description: 'guessPkgName derives the default package name from an import path.
    Without type information the declared name is unknown, so the usual conventions
    are applied: "…/yaml.v3" -> yaml, "…/foo/v2" -> foo, otherwise the last element.'
  references: []
  calls:
  - MatchString
  - ReplaceAllString
- name: docText
  kind: func
  description: docText returns the text of a doc comment group on a single line, with
    whitespace runs folded to one space; "" for no comment.
  references: []
  calls:
  - ReplaceAllString
- name: isImport
  kind: method
  receiver: fileCtx
  description: 'isImport reports whether id names an imported package: its alias is
    imported and the parser did not resolve it to a local declaration (a local variable
    called like an import shadows it).'
  references: []
  calls: []
- name: typeName
  kind: method
  receiver: fileCtx
  description: typeName names the type an expression denotes, if it is a plain named
    type.
  references: []
  calls:
  - Lookup
- name: exprType
  kind: method
  receiver: fileCtx
  description: exprType resolves the type of the few initializer shapes that state
    it.
  references: []
  calls: []
- name: identType
  kind: method
  receiver: fileCtx
  description: identType resolves a local identifier to its declared type through
    the parser's scope resolution.
  references: []
  calls: []
- name: exported
  kind: func
  description: exported reports whether name starts with an upper-case letter.
  references: []
  calls: []
- name: newCollector
  kind: func
  description: newCollector returns an empty collector resolving names through c.
  references: []
  calls: []
- name: addCall
  kind: method
  receiver: collector
  description: addCall records c unless the same call was already recorded.
  references: []
  calls: []
- name: visit
  kind: method
  receiver: collector
  description: visit walks the subtree of n, recording every selector on an imported
    package as a Ref and every call as by call. A nil node is ignored.
  references: []
  calls: []
- name: call
  kind: method
  receiver: collector
  description: call records a call expression if the called name is exported. Generic
    instantiations and parentheses are stripped first. A plain identifier is recorded
    by name only; for a selector the receiver is classified as an import alias (Pkg),
    a local identifier with a syntactically known type (Pkg/Type), or unknown (name
    only).
  references: []
  calls: []
- name: recvTypeName
  kind: func
  description: recvTypeName returns the base type name of a method receiver, stripping
    pointers, parentheses and type parameters; "" if it is not a plain name.
  references: []
  calls: []
- name: typeObject
  kind: method
  receiver: fileCtx
  description: 'typeObject builds the Object for a type declaration: kind struct,
    interface (with its sorted exported method names; embedded interfaces are not
    listed) or type, and the package refs found in the type expression. Types record
    no calls.'
  references: []
  calls: []
- name: dump
  kind: func
  description: dump parses one file and returns its package, package doc, imports
    and top-level declarations. A parse error is reported in FileDump.Error, not returned.
    Blank and dot imports and "_" names are skipped. A declaration's doc is its own
    comment; inside a parenthesized group the group's comment is not inherited.
  references: []
  calls:
  - Error
  - IsValid
- name: main
  kind: func
  description: 'main dumps every file named on the command line and writes one JSON
    object {"files": [...]} to stdout. It exits with status 2 without arguments and
    1 if the output cannot be written; per-file parse errors do not fail the run.'
  references: []
  calls:
  - Encode
  - SetEscapeHTML
- name: reMajor
  kind: var
  description: reMajor matches a major-version path element such as "v2".
  references: []
- name: reDotVer
  kind: var
  description: reDotVer matches a gopkg.in-style ".vN" suffix such as in "yaml.v3".
  references: []
- name: spaceRuns
  kind: var
  description: spaceRuns matches whitespace runs, folded to one space in doc text.
  references: []
