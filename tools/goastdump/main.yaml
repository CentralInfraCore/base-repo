---
package: main
description: 'goastdump parses Go source files with go/parser and prints their top-level
  declarations as JSON. It is the syntactic front end of tools/go.meta.gen.py: the
  Python side decides what counts as an external reference and writes the companion
  YAML, this tool only reports what the Go syntax tree says. Usage: goastdump <file.go>
  [<file.go> ...] Only the standard library is used and no type checking happens,
  so it runs offline and without the dependencies of the code it reads. A call receiver
  is resolved to a type only where the syntax states it (parameter, receiver, "var
  x T", "x := T{}" / "x := &T{}"); everything else stays untyped.'
tags:
- core
- gateway
