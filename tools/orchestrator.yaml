---
module: tools.orchestrator
description: 'CIC Agent Orchestrator Deterministic, zero-token agent runner built
  on PROMPTMAP.yaml task queue. Flow: 1. Parse PROMPTMAP → pick next todo task (highest
  priority) 2. Load task profile (task_profile field) + scope profile (scope_profile
  field) 3. Build agent briefing from profiles + task prompt 4. Print briefing to
  stdout (agent reads it) or spawn subprocess 5. Run accept gate (accept field from
  task) 6. On exit 0 → mark task done; on fail → mark task failed (max retries) Usage:
  python orchestrator.py --repo CIC-Relay --sprint 15 python orchestrator.py --repo
  CIC-Relay --task upstream-source-http --print-briefing python orchestrator.py --list-tasks
  --repo CIC-Relay --status todo'
tags:
- builder
- core
- executor
- loader
category: []
used_in: []
entrypoint: true
related_nodes: []
objects:
- name: PROFILES_BASE
  kind: const
  description: ''
  references: []
- name: TASK_PROFILES_DIR
  kind: const
  description: ''
  references: []
- name: SCOPE_PROFILES_DIR
  kind: const
  description: ''
  references: []
- name: PROMPTMAP_PATHS_ENV
  kind: const
  description: ''
  references: []
- name: SOURCE_DIR
  kind: const
  description: ''
  references: []
- name: MAX_RETRIES
  kind: const
  description: ''
  references: []
- name: find_promptmaps
  kind: function
  decorators: []
  description: 'The PROMPTMAP.yaml files to read: the colon-separated list in PROMPTMAP_PATHS,
    else every PROMPTMAP.yaml under SOURCE_DIR.'
  references: []
  calls:
  - PROMPTMAP_PATHS_ENV.split
  - SOURCE_DIR.rglob
  - p.strip
- name: _repo_name
  kind: function
  decorators: []
  description: 'The repository a PROMPTMAP belongs to: the directory above its ``ai/``
    directory, or else its grandparent directory.'
  references: []
  calls: []
- name: iter_tasks
  kind: function
  decorators: []
  description: Yield (sprint_num, task_dict) from a PROMPTMAP structure.
  references: []
  calls:
  - block.get
  - data.get
- name: load_tasks
  kind: function
  decorators: []
  description: Collect the tasks of every PROMPTMAP, optionally filtered by repository
    (case-insensitive substring), sprint and status, each annotated with its repository,
    sprint and PROMPTMAP path, sorted by priority (tasks without one last).
  references:
  - yaml.safe_load
  calls:
  - _repo_name
  - pm_path.open
  - repo.lower
  - results.append
  - results.sort
  - rname.lower
  - task.get
  - x.get
  - yaml.safe_load
- name: update_task_status
  kind: function
  decorators: []
  description: Set the status of task_id (plus any extra fields) wherever it appears
    in a PROMPTMAP - entries, sprint task lists or a flat task list - and rewrite
    the file; returns whether the task was found.
  references:
  - yaml.dump
  - yaml.safe_load
  calls:
  - block.get
  - data.get
  - pm_path.open
  - task.get
  - task.update
  - yaml.dump
  - yaml.safe_load
- name: load_profile
  kind: function
  decorators: []
  description: Load a task or scope profile ``<name>.yaml``; {} if it does not exist.
  references:
  - yaml.safe_load
  calls:
  - p.exists
  - p.open
  - yaml.safe_load
- name: build_briefing
  kind: function
  decorators: []
  description: 'Render the Markdown briefing an agent works from: the task''s identity
    and priority, the task profile (description, boot sequence, forbidden actions),
    the scope profile (what it owns and reads, test command, coverage floor, invariants,
    MCP focus queries), the task prompt, the tests to touch and the accept gate.'
  references: []
  calls:
  - scope_profile.get
  - task.get
  - task_profile.get
- name: run_accept_gate
  kind: function
  decorators: []
  description: Run a task's accept command through the shell and return its exit status
    (the command comes from the PROMPTMAP, a trusted file).
  references: []
  calls: []
- name: main
  kind: function
  decorators: []
  description: List tasks, or pick a task (``--task`` or the highest-priority todo),
    print its briefing and - unless ``--print-briefing`` - run its accept gate, marking
    the task done on success and failed after MAX_RETRIES failed attempts.
  references: []
  calls:
  - parser.add_argument
  - parser.parse_args
  - t.get
  - task.get
