---
module: tools.compiler
description: 'Command-line entry point of the release tooling (``python -m tools.compiler``).
  Subcommands, run by the Makefile inside the builder container: ``check --version
  X`` (local pre-flight checks, ``ReleaseManager.run_check``), ``prepare --version
  X`` (developer preparation phase - release branch and signed ``project.yaml``, ``ReleaseManager.run_prepare_release``)
  and ``close --version X`` (finalization phase, ``ReleaseManager.run_finalize_release``).
  Configuration comes from the ``compiler_settings`` block of ``project.yaml`` in
  the current directory. Vault access is taken from ``VAULT_ADDR`` and ``VAULT_TOKEN``
  (falling back to the token file named by ``CIC_VAULT_TOKEN_FILE``, default ``/var/run/secrets/vault-token``)
  and ``VAULT_CACERT`` (falling back to ``/var/run/secrets/vault-ca.crt``).'
tags:
- builder
- core
- loader
category: []
used_in: []
entrypoint: true
related_nodes: []
objects:
- name: LOG_FORMAT
  kind: const
  description: ''
  references: []
- name: COLOR_CODES
  kind: const
  description: ''
  references: []
- name: RESET_CODE
  kind: const
  description: ''
  references: []
- name: ColoredFormatter
  kind: class
  decorators: []
  description: 'Log formatter that colors each line with an ANSI code chosen by its
    content: lines with ``DRY-RUN``, ``ACTION REQUIRED`` or ``✓`` get the dry-run,
    manual-step and success colors, other lines the color of their level.'
  implements:
  - logging.Formatter
  references: []
- name: format
  kind: method
  receiver: ColoredFormatter
  decorators: []
  description: Format the record, then wrap it in the color code and a reset.
  references: []
  calls:
  - COLOR_CODES.get
- name: setup_logging
  kind: function
  decorators: []
  description: Return this module's logger writing to stdout at the requested verbosity.
    The handler level is DEBUG with ``debug``, INFO with ``verbose``, WARNING otherwise.
    A stdout handler is added only if the logger has no stream handler yet, and propagation
    to the root logger is turned off.
  references: []
  calls:
  - handler.setLevel
  - logger.addHandler
  - logger.setLevel
- name: load_project_config
  kind: function
  decorators: []
  description: Load ``project.yaml`` from the current directory. Returns the whole
    document. Exits the process with status 1 if the file cannot be read or parsed
    or has no ``compiler_settings`` key.
  references:
  - yaml.YAMLError
  - yaml.safe_load
  calls:
  - KeyError
  - logger.critical
  - yaml.safe_load
- name: main
  kind: function
  decorators: []
  description: Parse the command line, build the Git and Vault services and dispatch
    the subcommand. A ``ManualInterventionRequired`` (a release that stops for a human)
    is logged as an action and exits with status 0; a ``ReleaseError`` or any other
    exception is logged as critical and exits with status 1.
  references:
  - .releaselib.exceptions.ReleaseError
  - .releaselib.exceptions.ManualInterventionRequired
  - .infra.ReleaseManager
  - .releaselib.vault_service.VaultService
  - .releaselib.git_service.GitService
  calls:
  - .infra.ReleaseManager
  - .releaselib.git_service.GitService
  - .releaselib.vault_service.VaultService
  - check_parser.add_argument
  - close_parser.add_argument
  - f.read
  - full_config.get
  - logger.critical
  - logger.info
  - logger.warning
  - manager.run_check
  - manager.run_finalize_release
  - manager.run_prepare_release
  - parent_parser.add_argument
  - parser.add_subparsers
  - parser.parse_args
  - prepare_parser.add_argument
  - subparsers.add_parser
