    A repository is a directory with a ``.git`` entry (a file for submodules). The
    walk does not descend into a repository except through the paths its ``.gitmodules``
    declares, so large work trees are never scanned. If no repository is found but
    ``source_dir`` lies inside one, that repository is reported with ``path: "."``.'
  references: []
