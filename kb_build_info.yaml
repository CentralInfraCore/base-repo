  kind: function
  decorators: []
  description: 'How far the checked-out commit is behind its upstream, from local
    refs only. Only as fresh as the last ``git fetch`` of that repository, so the
    time of the last fetch is reported with it: ``behind_upstream: 0`` next to an
    old (or missing) ``upstream_fetched_at`` means "not known to be behind", not "up
    to date".'
  references: []
  calls:
