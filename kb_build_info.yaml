  - _rev_count
  - path.is_file
  - path.stat
  - stamp.replace
- name: staleness
  kind: function
  decorators: []
  description: Compare each recorded source with its working tree as it is now. Per
    source ``state`` is one of ``current``, ``behind`` (the tree has ``commits_since``
    newer commits), ``ahead`` (the tree is on an older commit than recorded), ``diverged``,
    ``unknown`` (the recorded commit is not in the repository any more) or ``missing``
    (the path is gone). ``dirty_now`` reports uncommitted changes to tracked files.
    ``behind_upstream`` is how far the working tree itself is behind its upstream
    (see :func:`_upstream`); it does not affect ``stale``, which is about the KB versus
    the working trees.
  references: []
  calls:
  - _git
  - _now
  - _rev_count
  - _upstream
