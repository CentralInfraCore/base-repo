---
module: kb_build_info
description: 'kb_build_info.py — provenance of a knowledge-base build. A KB is built
  from a tree of source repositories (usually git submodules under ``source/``). Nothing
  in the pkl files says *which commit* of which repository the chunks came from, so
  "how stale is the KB?" could only be answered by reading git logs by hand. This
  module records that, in the style of ``project.yaml``: * ``build_info.yaml`` next
  to the pkl files, per source repository: remote, commit, tag-based ``describe``,
  branch, whether the checked-out tree was dirty and the ``metadata.version`` of its
  ``project.yaml``; * one meta chunk (``c_kb_build_info``) in the dataset with the
  same content, so ``search_nodes`` finds it without file access; * :func:`staleness`,
  which compares the recorded commits with the source trees as they are now — the
  ``build`` section of ``kb_status`` is built from it. It is written by every path
  that changes the KB (``make_source.py``, ``kb_watch.py``, the server''s bootstrap),
  so it cannot drift from the data. Only the standard library and PyYAML are used.'
tags:
- loader
