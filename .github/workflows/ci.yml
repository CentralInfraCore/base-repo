---
name: CI

on:
  push:
    branches:
      - mcp/main
      - mcp/devel
      - mcp/f/**
  pull_request:
    branches:
      - mcp/main
      - mcp/devel

jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Export host UID/GID for docker compose
        run: |
          echo "UID=$(id -u)" >> "$GITHUB_ENV"
          echo "GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Pre-create bind-mount directories owned by the runner user
        run: mkdir -p p_venv .pip-cache

      - name: Build Docker images
        run: make build

      - name: Start builder container
        run: docker compose up -d builder

      - name: Generate and check requirements.txt for drift
        run: |
          make infra.deps
          git diff --exit-code requirements.txt

      - name: Verify repository manifest
        run: make manifest-verify

      - name: Run code quality checks
        run: make check

      - name: Run tests and generate coverage report
        run: make test

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: html-coverage-report
          path: htmlcov/

  go_ast_front_end:
    # The go/ast reader behind tools/go.meta.gen.py. The builder image above has
    # no Go toolchain, so the Go-dependent tests run here, where a missing
    # toolchain is a failure (GO_META_REQUIRE_GO=1), not a skip.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/goastdump/go.mod

      - name: gofmt
        run: test -z "$(gofmt -l tools/goastdump)"

      - name: go vet and go test
        working-directory: tools/goastdump
        run: |
          go vet ./...
          go test ./...

      - name: Python tests against the real front end
        env:
          GO_META_REQUIRE_GO: "1"
        run: |
          pip install pytest pytest-cov pyyaml
          python -m pytest tests/test_tools/test_go_meta_gen.py
