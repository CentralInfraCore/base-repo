---
module: make_source
description: Build the CIC knowledge base from the ``source/`` tree. Markdown is split
  into one chunk per heading section (merged with its companion ``.yaml`` metadata);
  Go and Python code enters only through its companion YAMLs, one chunk per file plus
  one per object; any other YAML is one chunk. The chunks are deduplicated, given
  persistent ids, embedded, and indexed with BM25 and FAISS; a knowledge graph is
  built from sequence, cosine similarity, ``related_nodes`` and call edges. The result
  is written as pickles/JSON under ``kb_data/`` and as SQLite under ``sqlite_data/``,
  together with the build provenance (``kb_build_info``).
tags:
- builder
- core
- loader
- storage
category: []
used_in: []
entrypoint: true
related_nodes: []
objects:
- name: EMBEDDING_MODEL
  kind: const
  description: ''
  references: []
- name: EXCLUDE_DIRS
  kind: const
  description: ''
  references: []
- name: tokenize
  kind: function
  decorators: []
  description: 'Split text into lower-case search tokens: camelCase and acronym boundaries
    are split, and surrounding punctuation is stripped.'
  references: []
  calls:
  - t.strip
  - text.lower
- name: detect_language
  kind: function
  decorators: []
  description: The language code langdetect assigns to text, or "unknown" when it
    cannot tell.
  references:
  - langdetect.LangDetectException
  - langdetect.detect
  calls:
  - langdetect.detect
- name: load_companion_yaml
  kind: function
  decorators: []
  description: Load a companion .yaml file for an .md file if it exists.
  references:
  - yaml.YAMLError
  - yaml.safe_load
  calls:
  - yaml.safe_load
- name: _normalize_list
  kind: function
  decorators: []
  description: Normalize a YAML value to a list of strings.
  references: []
  calls: []
- name: process_md_file
  kind: function
  decorators: []
  description: Split a Markdown file into one chunk per heading section (text before
    the first heading is a section of its own), with line ranges, detected language
    and the companion YAML's metadata.
  references: []
  calls:
  - _normalize_list
  - chunk.update
  - chunks.append
  - companion.get
  - current_chunk_lines.append
  - f.readlines
  - match.group
- name: process_go_yaml
  kind: function
  decorators: []
  description: Process a .go.yaml companion file as structured knowledge chunks. The
    .go source file is not indexed (code excluded by design); this YAML is the sole
    knowledge source for Go files in the KB. Produces one chunk per object defined
    in the file. File-level metadata (tags, category, used_in) is applied to all chunks.
  references:
  - yaml.YAMLError
  - yaml.safe_load
  calls:
  - _normalize_list
  - chunk.update
  - chunks.append
  - data.get
  - f.get
  - lines.append
  - m.get
  - o.get
  - obj.get
  - p.get
  - pkg_lines.append
  - position.get
  - signature.get
  - yaml.safe_load
- name: process_py_yaml
  kind: function
  decorators: []
  description: 'Process a .py.yaml companion file as structured knowledge chunks.
    Mirrors process_go_yaml: the .py source file is not indexed directly (code excluded
    by design); this YAML is the sole knowledge source for Python files in the KB.
    Produces one chunk per object defined in the file. File-level metadata (tags,
    category, used_in) is applied to all chunks.'
  references:
  - yaml.YAMLError
  - yaml.safe_load
  calls:
  - _normalize_list
  - chunk.update
  - chunks.append
  - data.get
  - lines.append
  - mod_lines.append
  - o.get
  - obj.get
  - yaml.safe_load
- name: process_yaml_file
  kind: function
  decorators: []
  description: Processes a YAML file as a single, large chunk to preserve context.
  references:
  - yaml.YAMLError
  - yaml.dump
  - yaml.safe_load
  calls:
  - text_content.splitlines
  - yaml.dump
  - yaml.safe_load
- name: create_embeddings
  kind: function
  decorators: []
  description: Encode texts using a multilingual sentence transformer model.
  references:
  - numpy.array
  - sentence_transformers.SentenceTransformer
  calls:
  - model.encode
  - numpy.array
  - sentence_transformers.SentenceTransformer
- name: build_faiss_index
  kind: function
  decorators: []
  description: Build FAISS inner-product index (cosine sim with normalized vectors).
  references:
  - faiss.IndexFlatIP
  calls:
  - faiss.IndexFlatIP
  - index.add
- name: build_bm25_index
  kind: function
  decorators: []
  description: Build BM25 index for lexical search.
  references:
  - rank_bm25.BM25Okapi
  calls:
  - rank_bm25.BM25Okapi
- name: create_bm25_inverted_index
  kind: function
  decorators: []
  description: 'Build inverted index: word → [{chunk_id, score}, ...] sorted by score
    desc.'
  references: []
  calls:
  - bm25.get_scores
  - entries.sort
  - vocab.update
- name: build_metadata_index
  kind: function
  decorators: []
  description: Build O(1) lookup indexes for tags, category, used_in, entrypoints.
  references: []
  calls:
  - category_index.setdefault
  - chunk.get
  - entrypoint_ids.append
  - tag_index.setdefault
  - used_in_index.setdefault
- name: _resolve_related_node
  kind: function
  decorators: []
  description: Resolve a relative related_node path to chunk_ids.
  references: []
  calls:
  - path_to_chunk_ids.items
- name: create_knowledge_graph_with_content
  kind: function
  decorators: []
  description: Build knowledge graph using embedding cosine similarity + YAML related_nodes.
  references: []
  calls:
  - _resolve_related_node
  - call.split
  - call_name_index.get
  - call_name_index.setdefault
  - chunk.get
  - chunk_id_to_node_id.get
  - cid.encode
  - cid.startswith
  - ctype.startswith
  - edges.append
  - iface_name_index.get
  - iface_name_index.setdefault
  - nodes.append
  - path_to_chunk_ids.setdefault
  - seen_calls.add
  - seen_impl.add
  - seen_refs.add
- name: _content_hash
  kind: function
  decorators: []
  description: Return SHA256 hex digest of normalized text content.
  references: []
  calls:
  - text.strip
- name: _dedup_chunks
  kind: function
  decorators: []
  description: 'Deduplicate chunks with identical content. Chunks with the same text
    are merged into a single chunk: - file_path  : canonical (first seen) path — kept
    for backward compat - file_paths : list of ALL paths where this content appears
    - tags / category / used_in / related_nodes : union of all occurrences'
  references: []
  calls:
  - _content_hash
  - chunk.copy
  - chunk.get
  - existing.add
  - m.get
  - order.append
- name: _is_go_meta_yaml
  kind: function
  decorators: []
  description: Return True if the YAML file is a Go meta companion (has 'package'
    + 'objects'). Used when the sibling .go file is absent (e.g. in docs-only submodules).
  references:
  - yaml.safe_load
  calls:
  - yaml.safe_load
- name: _is_py_meta_yaml
  kind: function
  decorators: []
  description: Return True if the YAML file is a Python meta companion (has 'module'
    + 'objects'). Used when the sibling .py file is absent (e.g. in docs-only submodules).
  references:
  - yaml.safe_load
  calls:
  - yaml.safe_load
- name: process_directory
  kind: function
  decorators: []
  description: Collect the chunks of every file under directory_path, skipping EXCLUDE_DIRS.
    A first pass classifies each YAML by its sibling (.md, .go or .py); the second
    routes Markdown, Go and Python companions and other YAML to their processors.
    A companion without a sibling source is recognised by its keys.
  references: []
  calls:
  - _is_go_meta_yaml
  - _is_py_meta_yaml
  - all_chunks.extend
  - file.endswith
  - go_companion_yamls.add
  - md_companion_yamls.add
  - py_companion_yamls.add
- name: _generate_chunk_id
  kind: function
  decorators: []
  description: Generate persistent chunk ID based on file_path + type + section. Ensures
    same chunk (same location, same type) gets same ID across builds, enabling incremental
    updates without relabeling.
  references: []
  calls:
  - base.encode
- name: build_knowledge_base
  kind: function
  decorators: []
  description: 'Build every KB artifact from source_directory and return them in one
    dict: chunks with persistent ids, the build-info chunk, embeddings, BM25 and FAISS
    indexes, the metadata index and the graph (edges carry their evidence location).'
  references:
  - kb_build_info.meta_chunk
  - kb_build_info.build_info
  calls:
  - _dedup_chunks
  - _generate_chunk_id
  - chunk.get
  - chunks_list.append
  - chunks_list.sort
  - kb_build_info.build_info
  - kb_build_info.meta_chunk
- name: save_knowledge_base_legacy
  kind: function
  decorators: []
  description: 'Write the KB under output_dir: JSON files in ``json/`` and pickles
    plus the FAISS index in ``pkl/`` (the files the MCP server loads).'
  references:
  - faiss.write_index
  calls:
  - faiss.write_index
  - kb_data.get
  - legacy_data.items
- name: save_kb_to_sqlite
  kind: function
  decorators: []
  description: 'Recreate ``knowledge_base.sqlite`` in output_dir from the table definitions
    in ``db_schema.json`` and fill it: files, terms, chunks and their paths, nodes,
    edges and the edge evidence.'
  references: []
  calls:
  - c.get
  - conn.close
  - conn.commit
  - conn.cursor
  - cursor.execute
  - cursor.executemany
  - e.get
  - files_map.items
  - inverted_index_data.append
  - kb_data.get
  - table.get
  - terms_map.get
  - terms_map.items
- name: generate_edge_types_doc
  kind: function
  decorators: []
  description: Generates a markdown file documenting all unique edge types.
  references: []
  calls:
  - f.write
